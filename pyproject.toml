[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wajub"
version = "1.3.0"
description = "Official Wajub Python SDK — server-side payments, webhooks, and merchant API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wajub", email = "hello@wajub.com" }]
keywords = ["wajub", "payments", "checkout", "mobile-money", "africa", "webhooks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "hatchling>=1.24",
    "pytest>=8.0",
    "ruff==0.17.1",
]

[project.urls]
Homepage = "https://wajub.com"
Documentation = "https://docs.wajub.com/libraries/sdks/python"
Repository = "https://github.com/wajubhq/wajub-python"
Issues = "https://github.com/wajubhq/wajub-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wajub"]

# `python -m build` builds the wheel from the sdist, so whatever is missing here
# is missing from the wheel too. 1.1.0 and 1.1.1 listed only the py.typed marker
# and went to PyPI without a single module.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
