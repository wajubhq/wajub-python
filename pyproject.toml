[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wajub"
version = "1.2.0"
description = "Official Wajub Python SDK — server-side payments, webhooks, and merchant API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wajub", email = "hello@wajub.com" }]
keywords = ["wajub", "payments", "checkout", "mobile-money", "africa", "webhooks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://wajub.com"
Documentation = "https://docs.wajub.com/libraries/sdks/python"
Repository = "https://github.com/wajubhq/wajub-python"
Issues = "https://github.com/wajubhq/wajub-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wajub"]

[tool.hatch.build.targets.sdist]
include = ["src/wajub/py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
